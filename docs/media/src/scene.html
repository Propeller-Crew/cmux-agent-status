<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cmux agent status: media scene</title>
<!--
  One page that draws every image and video in docs/media from a recreation of the
  sidebar with demo data (the live one shows real workspace names). render.mjs opens
  it with ?mode=…, injects the octopus straight from sidebars/agent-status.js, and
  for video calls window.seek(t) frame by frame. Sizes and colours mirror the
  sidebar's constants (ROW_H, CARD_BG, SECTIONS…), so update both together.
-->
<style>
  :root {
    --ink: rgba(255,255,255,.92); --ink2: rgba(255,255,255,.55); --ink3: rgba(255,255,255,.30);
    --orange: #F5A524; --blue: #4C9EEB; --violet: #9B7BFF; --green: #34C759; --red: #FF453A;
    --gray: #8E8E93; --teal: #5AC8FA;
    --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --display: -apple-system, "SF Pro Display", system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #07080c; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background:
      radial-gradient(60% 70% at 78% 30%, #5b8cff2e, transparent 70%),
      radial-gradient(50% 60% at 95% 95%, #ec48991f, transparent 70%),
      radial-gradient(55% 60% at 10% 90%, #8b5cf624, transparent 70%),
      linear-gradient(160deg, #0d0f17, #07080c 60%); }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(#ffffff0d 1px, transparent 1px); background-size: 22px 22px;
      mask-image: linear-gradient(180deg, #000, transparent 85%); }

  /* --- window ------------------------------------------------------------------ */
  .win { position: absolute; display: flex; border-radius: 12px; overflow: hidden;
         box-shadow: 0 0 0 1px #ffffff1f, 0 40px 120px -20px #000000d0, 0 0 80px -30px #5b8cff80; transform-origin: 0 0; }
  .sb { position: relative; width: 252px; background: #1c1c1f; flex: none; }
  .sb.solo { border-radius: 14px; box-shadow: 0 0 0 1px #ffffff1f, 0 40px 120px -20px #000000d0, 0 0 90px -30px #5b8cff90; position: absolute; transform-origin: 0 0; overflow: hidden; }
  .sb-top { position: absolute; left: 0; right: 0; top: 0; height: 34px; display: flex; align-items: center; padding: 0 12px 0 14px; gap: 8px; }
  .light { width: 12px; height: 12px; border-radius: 50%; }
  .tb-ico { width: 15px; height: 15px; color: var(--ink2); }
  .list { position: absolute; left: 8px; right: 8px; top: 36px; }
  .entry { position: absolute; left: 0; right: 0; }
  .hdr { display: flex; align-items: flex-start; padding: 14px 10px 4px 6px; }
  .hdr.first { padding-top: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 11px; font-size: 12px; font-weight: 600; line-height: 14px; }
  .pill svg { width: 10px; height: 10px; }
  .pill .n { font-size: 11px; font-weight: 700; opacity: .7; }
  .chev { margin-left: auto; width: 14px; height: 14px; color: var(--ink3); margin-top: 4px; }
  .row { height: 30px; padding: 6px 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .row.prog { height: 37px; }
  .row .line { display: flex; align-items: center; gap: 8px; }
  .row .t { font-size: 13px; line-height: 17px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .ago { font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .ico16 { width: 16px; height: 16px; display: grid; place-items: center; flex: none; }
  .ico16 span svg { width: 10px; height: 10px; display: block; }
  .segs { display: flex; gap: 2px; height: 3px; }
  .segs i { width: 7px; height: 3px; border-radius: 2px; background: #7f7f7f40; }
  .tab { height: 22px; padding: 3px 10px 3px 18px; display: flex; align-items: center; gap: 8px; border-radius: 6px; }
  .tab .bar { width: 1px; height: 14px; background: #7f7f7f40; }
  .tab .t { font-size: 12px; color: var(--ink2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .ago { font-size: 11px; color: var(--ink3); }
  .key { font: 600 11px var(--sans); color: var(--ink); background: #ffffff1f; border: 1px solid #ffffff33; box-shadow: 0 1px 0 #ffffff26;
         border-radius: 5px; padding: 0 5px; line-height: 16px; white-space: nowrap; }

  .chip { position: absolute; left: 8px; right: 8px; height: 34px; border-radius: 12px; background: #4C9EEB1f; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .chip .t { font-size: 12px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .ago { font-size: 11px; color: var(--ink2); }
  .chip .paste { font-size: 11px; font-weight: 600; color: var(--blue); }
  .card { position: absolute; left: 8px; right: 8px; height: 102px; border-radius: 22px; background: #141418; border: 1px solid #FFFFFF14; padding: 14px 16px; }
  .card .top { display: flex; gap: 10px; align-items: center; height: 58px; }
  .pages { position: relative; flex: 1; height: 58px; }
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  .big { font-size: 22px; font-weight: 700; line-height: 26px; font-variant-numeric: tabular-nums; }
  .dim { font-size: 10px; color: #FFFFFF8C; white-space: nowrap; }
  .bar16 { display: flex; gap: 2px; } .bar16 i { flex: 1; height: 4px; border-radius: 2px; background: #FFFFFF26; }
  .btn { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 10px; margin-left: auto; }
  .stats { display: flex; gap: 10px; } .stat b { display: block; font-size: 16px; line-height: 19px; } .stat span { font-size: 9px; color: #FFFFFF8C; }
  .dots { display: flex; gap: 5px; justify-content: center; margin-top: 8px; } .dots i { width: 5px; height: 5px; border-radius: 50%; background: #FFFFFF40; }
  .foot { position: absolute; left: 14px; bottom: 9px; display: flex; gap: 10px; color: var(--ink3); }
  .foot svg { width: 14px; height: 14px; }

  /* --- terminal ----------------------------------------------------------------- */
  .term { position: relative; flex: 1; background: #232327; border-left: 1px solid #00000080; }
  .tabs { height: 34px; display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; border-bottom: 1px solid #ffffff12; background: #1c1c1f; }
  .ttab { height: 28px; padding: 0 14px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink2); border-radius: 7px 7px 0 0; max-width: 220px; white-space: nowrap; }
  .ttab.on { background: #232327; color: var(--ink); }
  .ttab .claude { color: #D97757; font-size: 13px; }
  .tbody { padding: 16px 22px 0 34px; font: 12.5px/1.62 var(--mono); color: #d8d8dc; white-space: pre-wrap; }
  .tbody .dim { font: inherit; color: #ffffff60; } .tbody .acc { color: #D97757; } .tbody .grn { color: #8bd5a0; } .tbody .usr { color: #fff; font-weight: 600; }
  .tbody .box { border: 1px solid #F5A52499; border-radius: 6px; padding: 8px 12px; margin: 6px 0; color: #fff; }
  .tbody .box .sel { color: var(--orange); }
  .prompt { position: absolute; left: 34px; right: 22px; bottom: 44px; border-top: 1px solid #ffffff1c; border-bottom: 1px solid #ffffff1c; padding: 8px 0; font: 12.5px var(--mono); color: #fff; }
  .status { position: absolute; left: 34px; bottom: 14px; font: 11.5px var(--mono); color: #ffffff70; }
  .caret { display: inline-block; width: 7px; height: 15px; background: #ffffffcc; vertical-align: -3px; }

  /* --- captions ----------------------------------------------------------------- */
  .cap { position: absolute; }
  .eyebrow { font: 600 15px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); display: flex; align-items: center; gap: 10px; }
  .h1 { font: 800 68px/1.02 var(--display); letter-spacing: -.035em; }
  .h2 { font: 750 56px/1.06 var(--display); letter-spacing: -.03em; }
  .sub { font: 400 24px/1.4 var(--sans); color: var(--ink2); letter-spacing: -.01em; }
  .grad { background: linear-gradient(90deg, #5B8CFF, #8B5CF6 35%, #EC4899 70%, #F59E0B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #ffffff10; border: 1px solid #ffffff1c; font: 500 16px var(--sans); color: var(--ink); }
  .mono { font-family: var(--mono); }
  canvas.octo { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------------------------------------------------------------------------------
// Constants copied from sidebars/agent-status.js
const C = { ORANGE: "#F5A524", BLUE: "#4C9EEB", VIOLET: "#9B7BFF", GREEN: "#34C759", RED: "#FF453A", GRAY: "#8E8E93", TEAL: "#5AC8FA" };
const SPIN = ["#5B8CFF", "#8B5CF6", "#EC4899", "#F59E0B", "#14B8A6"];
const H = { HEADER_FIRST: 30, HEADER: 40, ROW: 30, ROW_PROGRESS: 37, TAB: 22, GAP: 2, CARD: 108, DL: 40 };
const SECTIONS = [
  { id: "needs", label: "Needs you", color: C.ORANGE, icon: "hand" },
  { id: "unread", label: "New", color: C.BLUE, icon: "sparkles" },
  { id: "working", label: "Working", color: C.VIOLET, icon: "bolt" },
  { id: "fresh", label: "No task yet", color: C.TEAL, icon: "pencil" },
  { id: "done", label: "Done", color: C.GREEN, icon: "seal" },
  { id: "inactive", label: "Sleeping", color: C.GRAY, icon: "moonzzz" },
];
// Injected by render.mjs from the sidebar source; a placeholder blob otherwise.
const OCTO = window.__OCTO ?? { palette: { x: "#398FE2" }, frames: { idle: [Array(16).fill("x".repeat(16))] } };

// --- icons (SF Symbols stand-ins) ---------------------------------------------------
const I = {
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 1.5 3.5 14h7.2l-1.2 8.5L20.5 9.8h-7.3z"/></svg>',
  hand: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10h.5V3.5a1.5 1.5 0 0 1 3 0V10h.5V4.8a1.5 1.5 0 0 1 3 0V11h.4V7.5a1.5 1.5 0 0 1 3 0V15a8 8 0 0 1-8 8h-1a7.5 7.5 0 0 1-5.6-2.5L2.6 16a1.6 1.6 0 0 1 2.3-2.2L7 15.6z"/></svg>',
  sparkles: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 2.5 12 9l6.5 2-6.5 2-2 6.5L8 13l-6.5-2L8 9zM19 1l.9 2.6 2.6.9-2.6.9L19 8l-.9-2.6-2.6-.9 2.6-.9z"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5H6a2.5 2.5 0 0 0-2.5 2.5v12A2.5 2.5 0 0 0 6 20.5h12a2.5 2.5 0 0 0 2.5-2.5v-6"/><path d="M18.5 2.8a2.1 2.1 0 1 1 3 3L12.5 14.8l-4 1 1-4z"/></svg>',
  seal: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="m12 1 2.6 2 3.3-.4 1.2 3.1 3.1 1.2-.4 3.3 2 2.6-2 2.6.4 3.3-3.1 1.2-1.2 3.1-3.3-.4L12 23l-2.6-2-3.3.4-1.2-3.1-3.1-1.2.4-3.3L0 12l2.2-2.6-.4-3.3 3.1-1.2 1.2-3.1 3.3.4z"/><path d="m7.5 12.2 3 3 6-6.4" fill="none" stroke="#1c1c1f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  moonzzz: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 15.5A8.5 8.5 0 1 1 9 4a7 7 0 0 0 10 11.5z"/><path d="M15 2h5l-5 5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev: (open) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${open ? 90 : 0}deg)"><path d="m9 5 7 7-7 7"/></svg>`,
  spinner: (rot, color) => {
    let s = `<svg viewBox="0 0 24 24" width="14" height="14" style="transform:rotate(${rot}deg)">`;
    for (let i = 0; i < 8; i += 1) {
      const a = (i / 8) * Math.PI * 2, x1 = 12 + Math.cos(a) * 5.5, y1 = 12 + Math.sin(a) * 5.5, x2 = 12 + Math.cos(a) * 10, y2 = 12 + Math.sin(a) * 10;
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2.6" stroke-linecap="round" opacity="${0.25 + 0.75 * (i / 7)}"/>`;
    }
    return s + "</svg>";
  },
  record: `<svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="10" fill="none" stroke="${C.ORANGE}" stroke-width="2.2"/><circle cx="12" cy="12" r="5" fill="${C.ORANGE}"/></svg>`,
  checkFill: `<svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="11" fill="${C.BLUE}"/><path d="m7 12.3 3.2 3.2L17 8.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  check: '<svg viewBox="0 0 24 24" width="11" height="11"><path d="M20 6 9 17l-5-5" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  moon: '<svg viewBox="0 0 24 24" width="10" height="10"><path fill="rgba(255,255,255,.3)" d="M20 15A9 9 0 1 1 9 3.5 7.5 7.5 0 0 0 20 15z"/></svg>',
  photo: `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="${C.BLUE}" stroke-width="2.2" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="m3 18 5.5-6 4 4 3-3 5.5 5"/><circle cx="16" cy="8.8" r="1.6" fill="${C.BLUE}" stroke="none"/></svg>`,
  sidebar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5a6.5 6.5 0 0 1 11 0"/></svg>',
  help: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.4M12 17h.01"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 19a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 9.5 4.8 4.8 0 0 1 17.5 19z"/></svg>',
};

// --- demo data --------------------------------------------------------------------
// state: needs | unread | working | fresh | done ; ago in seconds; progress [done,total]
function baseWorld() {
  return {
    rows: {
      pay: { title: "Payments refactor", state: "working", ago: 120 },
      copy: { title: "Landing page copy", state: "unread", ago: 240 },
      e2e: { title: "Fix flaky e2e tests", state: "unread", ago: 540 },
      mono: { title: "Monorepo migration", state: "working", ago: 900, progress: [9, 16] },
      ios: { title: "iOS widget", state: "working", ago: 60, tabs: [
        { title: "Widget timeline", state: "working", ago: 60 },
        { title: "App Store screenshots", state: "unread", ago: 180 } ] },
      docs: { title: "Docs site search", state: "working", ago: 360 },
      idea: { title: "~/code/side-project", state: "fresh", ago: 30 },
      notes: { title: "Release notes v2.4", state: "done", ago: 3600 },
      dash: { title: "Analytics dashboard", state: "done", ago: 3 * 3600 },
      triage: { title: "Bug triage", state: "done", ago: 5 * 3600 },
    },
    order: ["pay", "copy", "e2e", "mono", "ios", "docs", "idea", "notes", "dash", "triage"],
    sleeping: 14,
    selected: "mono",
    page: 0, focusLeft: null,
    limit: { pct: 42, week: 18, at: "03:00", left: "2h 14m" },
    today: { prompts: 47, hours: "5.3", agents: 12, streak: 6 },
    download: null, keys: 0,
  };
}

function ago(s) {
  if (s < 45) return "now";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}

// Flatten the world into list entries with y positions (mirrors flatEntries + heights).
function layout(w) {
  const out = [];
  let y = 0, first = true;
  for (const s of SECTIONS) {
    const ids = w.order.filter((id) => w.rows[id].state === s.id);
    if (s.id !== "inactive" && ids.length === 0) continue;
    const h = first ? H.HEADER_FIRST : H.HEADER;
    out.push({ key: "h:" + s.id, kind: "header", section: s, count: s.id === "inactive" ? w.sleeping : ids.length, first, y, h });
    y += h + H.GAP; first = false;
    for (const id of ids) {
      const r = w.rows[id];
      const rh = r.progress ? H.ROW_PROGRESS : H.ROW;
      out.push({ key: id, kind: "row", row: r, id, y, h: rh });
      y += rh + H.GAP;
      if (r.tabs) r.tabs.forEach((tb, i) => { out.push({ key: id + ":" + i, kind: "tab", tab: tb, y, h: H.TAB }); y += H.TAB + H.GAP; });
    }
  }
  return { entries: out, height: y };
}

// --- sidebar rendering --------------------------------------------------------------
function stateIcon(state, t) {
  if (state === "working") return I.spinner(t * 300, SPIN[Math.floor(t) % SPIN.length]);
  if (state === "needs") return I.record;
  if (state === "unread") return I.checkFill;
  if (state === "done") return I.check;
  if (state === "fresh") return `<span style="color:${C.TEAL};width:10px;height:10px;display:block">${I.pencil}</span>`;
  return I.moon;
}

function entryHTML(e, w, t, keyIndex) {
  if (e.kind === "header") {
    const s = e.section;
    return `<div class="hdr ${e.first ? "first" : ""}"><span class="pill" style="color:${s.color};background:${s.color}26">${I[s.icon]}${s.label}<span class="n">${e.count}</span></span><span class="chev">${I.chev(s.id !== "inactive")}</span></div>`;
  }
  if (e.kind === "tab") {
    const tb = e.tab;
    return `<div class="tab" style="${tb.state === "unread" ? "background:#4C9EEB1c" : ""}"><span class="bar"></span><span class="t" style="${tb.state === "unread" ? "font-weight:600;color:var(--ink)" : ""}">${tb.title}</span><span class="ago">${ago(tb.ago)}</span><span class="ico16">${stateIcon(tb.state, t)}</span></div>`;
  }
  const r = e.row, sel = w.selected === e.id;
  const bg = sel ? "#7f7f7f3d" : r.state === "unread" ? "#4C9EEB24" : "transparent";
  const agoColor = r.state === "needs" ? C.ORANGE : r.state === "unread" ? C.BLUE : "var(--ink2)";
  const label = r.progress ? r.progress[0] + "/" + r.progress[1] : ago(r.ago);
  let segs = "";
  if (r.progress) {
    segs = '<div class="segs">';
    for (let i = 0; i < r.progress[1]; i += 1) segs += `<i style="${i < r.progress[0] ? "background:" + SPIN[i % SPIN.length] : ""}"></i>`;
    segs += "</div>";
  }
  const right = keyIndex != null ? `<span class="key">⌘${keyIndex}</span>` : `<span class="ago" style="color:${agoColor}">${label}</span>`;
  return `<div class="row ${r.progress ? "prog" : ""}" style="background:${bg}"><div class="line"><span class="t" style="${r.state === "unread" ? "font-weight:600" : ""}">${r.title}</span>${right}<span class="ico16">${stateIcon(r.state, t)}</span></div>${segs}</div>`;
}

function octoMood(w) {
  const states = Object.values(w.rows).map((r) => r.state);
  if (w.mood) return w.mood;
  if (states.includes("needs")) return "needs";
  if (states.includes("working")) return "work";
  if (states.includes("unread")) return "party";
  return "idle";
}

function octoCanvas(mood, tick, px) {
  const frames = OCTO.frames[mood] ?? OCTO.frames.idle;
  const f = frames[Math.floor(tick) % frames.length];
  const dpr = window.devicePixelRatio || 1;
  const c = document.createElement("canvas");
  c.className = "octo";
  c.width = Math.round(16 * px * dpr); c.height = c.width;
  c.style.width = 16 * px + "px"; c.style.height = 16 * px + "px";
  const g = c.getContext("2d");
  const cell = c.width / 16;
  for (let y = 0; y < 16; y += 1) for (let x = 0; x < 16; x += 1) {
    const col = OCTO.palette[f[y][x]];
    if (!col) continue;
    g.fillStyle = col;
    g.fillRect(Math.round(x * cell), Math.round(y * cell), Math.ceil(cell), Math.ceil(cell));
  }
  return c;
}

function cardPages(w) {
  const lim = w.limit, lc = lim.pct >= 90 ? C.RED : lim.pct >= 70 ? C.ORANGE : C.GREEN;
  const bar = (frac, color) => { let s = '<div class="bar16">'; for (let i = 0; i < 16; i += 1) s += `<i style="${(i + .5) / 16 <= frac ? "background:" + color : ""}"></i>`; return s + "</div>"; };
  const mmss = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  const running = w.focusLeft != null;
  const sel = w.rows[w.selected];
  return [
    `<div style="display:flex;align-items:baseline;gap:6px"><span class="big" style="color:${lc}">${lim.pct}%</span><span class="dim">5h</span><span class="dim" style="margin-left:auto">week ${lim.week}%</span></div>${bar(lim.pct / 100, lc)}<div class="dim">at ${lim.at} · ${lim.left}</div>`,
    `<div style="display:flex;align-items:center;gap:6px"><span class="big" style="color:${running ? C.VIOLET : "#fff"}">${mmss(running ? w.focusLeft : 1500)}</span><span class="btn" style="background:${running ? "#FFFFFF26" : C.VIOLET}">${running ? "■ Stop" : "▶ Start"}</span></div>${bar(running ? 1 - w.focusLeft / 1500 : 0, C.VIOLET)}<div class="dim">${running ? "Focus · until 01:12 · " + Math.ceil(w.focusLeft / 60) + "m" : "25 min, no distractions"}</div>`,
    `<div style="display:flex;align-items:center"><span style="font-size:11px;font-weight:600;color:#FFFFFF8C">Today</span><span style="margin-left:auto;font-size:10px;color:${C.ORANGE}">🔥 ${w.today.streak} days</span></div><div class="stats"><div class="stat"><b>${w.today.prompts}</b><span>prompts</span></div><div class="stat"><b>${w.today.hours}</b><span>h in Claude</span></div><div class="stat"><b>${w.today.agents}</b><span>agents</span></div></div>`,
    `<div style="font-size:11px;font-weight:600;color:#FFFFFF8C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sel ? sel.title : "No session selected"}</div><div class="stats" style="gap:12px"><div class="stat"><b>2.1</b><span>h in project</span></div><div class="stat"><b>18</b><span>prompts</span></div></div>`,
  ];
}

// Builds the sidebar element. `trans` = { from: world, p: 0..1 } animates rows between layouts.
function sidebar(w, t, height, trans, opts = {}) {
  const sb = document.createElement("div");
  sb.className = "sb" + (opts.solo ? " solo" : "");
  sb.style.height = height + "px";
  sb.innerHTML = `<div class="sb-top"><span class="light" style="background:#ff5f57"></span><span class="light" style="background:#febc2e"></span><span class="light" style="background:#28c840"></span>
    <span style="flex:1"></span><span class="tb-ico">${I.sidebar}</span><span class="tb-ico">${I.bell}</span><span class="tb-ico">${I.plus}</span><span class="tb-ico">${I.back}</span></div>`;
  const list = document.createElement("div");
  list.className = "list";
  const to = layout(w), from = trans ? layout(trans.from) : null;
  const ease = trans ? easeInOut(trans.p) : 1;
  const fromMap = new Map((from?.entries ?? []).map((e) => [e.key, e]));
  const toKeys = new Set(to.entries.map((e) => e.key));
  let keyIdx = 0;
  const rowsInOrder = to.entries.filter((e) => e.kind === "row").map((e) => e.key);
  for (const e of to.entries) {
    const el = document.createElement("div");
    el.className = "entry";
    const f = fromMap.get(e.key);
    const y = f ? f.y + (e.y - f.y) * ease : e.y;
    el.style.top = y + "px";
    if (trans && !f) el.style.opacity = ease;
    const ki = e.kind === "row" && w.keys > rowsInOrder.indexOf(e.key) ? rowsInOrder.indexOf(e.key) + 1 : null;
    el.innerHTML = entryHTML(e, w, t, ki != null && ki <= 9 ? ki : null);
    if (trans && f && e.kind === "row" && Math.abs(f.y - e.y) > 1) { el.style.zIndex = 2; el.firstChild.style.boxShadow = `0 ${8 * Math.sin(ease * Math.PI)}px 24px #0008`; }
    list.appendChild(el);
  }
  if (from) for (const f of from.entries) if (!toKeys.has(f.key)) {
    const el = document.createElement("div");
    el.className = "entry"; el.style.top = f.y + "px"; el.style.opacity = 1 - ease;
    el.innerHTML = entryHTML(f, trans.from, t);
    list.appendChild(el);
  }
  sb.appendChild(list);

  // Bottom stack: chip (optional), card, footer.
  const footH = 30, cardTop = height - footH - H.CARD;
  const card = document.createElement("div");
  card.className = "card"; card.style.top = cardTop + 6 + "px";
  const pages = cardPages(w);
  const cur = w.page, prev = w.prevPage ?? cur, pp = w.pageP ?? 1;
  card.innerHTML = `<div class="top"><span class="octo-slot"></span><div class="pages">${pages.map((html, i) => {
    const o = i === cur ? pp : i === prev ? 1 - pp : 0;
    return `<div class="page" style="opacity:${o};transform:translateY(${(i === cur ? 1 - pp : i === prev ? -pp : 0) * 6}px)">${html}</div>`;
  }).join("")}</div></div><div class="dots">${[0, 1, 2, 3].map((i) => `<i style="${i === cur ? "background:#fff" : ""}"></i>`).join("")}</div>`;
  card.querySelector(".octo-slot").replaceWith(octoCanvas(octoMood(w), t * 1.6, 2.5));
  sb.appendChild(card);
  if (w.download) {
    const d = w.download;
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.style.top = cardTop - H.DL + 6 + (1 - (d.in ?? 1)) * 16 + "px";
    chip.style.opacity = (d.in ?? 1) * (d.out != null ? 1 - d.out : 1);
    if (d.press) chip.style.background = `rgba(76,158,235,${0.12 + 0.25 * d.press})`;
    chip.innerHTML = `${I.photo}<span class="t">${d.name}</span><span class="ago">${d.ago}</span><span class="paste">Paste</span>`;
    sb.appendChild(chip);
  }
  const foot = document.createElement("div");
  foot.className = "foot"; foot.innerHTML = I.person + I.help + I.cloud;
  sb.appendChild(foot);
  return sb;
}

// --- terminal ---------------------------------------------------------------------
function terminal(w, t, scene) {
  const el = document.createElement("div");
  el.className = "term";
  const sel = w.rows[w.selected];
  const tabs = sel.tabs ? sel.tabs.map((x) => x.title) : [sel.title];
  el.innerHTML = `<div class="tabs">${tabs.map((n, i) => `<div class="ttab ${i === 0 ? "on" : ""}"><span class="claude">✳</span>${n}</div>`).join("")}</div>`;
  const body = document.createElement("div");
  body.className = "tbody";
  body.innerHTML = TERM[scene.term ?? w.selected] ?? TERM.mono;
  el.appendChild(body);
  const typed = w.typed ?? "";
  el.insertAdjacentHTML("beforeend", `<div class="prompt"><span class="dim" style="font:inherit">❯</span> ${typed}<span class="caret" style="opacity:${Math.floor(t * 2) % 2 ? 0 : 1}"></span></div>

  return el;
}

// --- timeline (video) -------------------------------------------------------------
const easeInOut = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const span = (t, a, b) => clamp01((t - a) / (b - a));

const SCENES = [
  { at: 0, end: 3.4, eyebrow: "", title: 'cmux <span class="grad">agent status</span>', sub: "A sidebar for cmux when most of your tabs run Claude Code." },
  { at: 3.4, end: 8.2, eyebrow: "01", title: "Sorted by what<br>they need from you", sub: "Needs you · New · Working · Done · Sleeping", term: "pay" },
  { at: 8.2, end: 12.6, eyebrow: "02", title: "Background agents<br>count as working", sub: "Progress of a batch, live: 12/16." },
  { at: 12.6, end: 17.6, eyebrow: "03", title: "Your Claude limit,<br>without opening the app", sub: "5-hour and weekly limits, a focus timer, today's stats.", zoom: "card" },
  { at: 17.6, end: 21.4, eyebrow: "04", title: "Latest download,<br>one click away", sub: "AirDrop a screenshot, paste it into Claude.", zoom: "chip", term: "dl" },
  { at: 21.4, end: 24.4, eyebrow: "05", title: "⌘1…9 follow<br>the sidebar", sub: "The top row is always ⌘1." },
  { at: 24.4, end: 28, eyebrow: "", title: 'Free &amp; open source', sub: "", outro: true },
];
const DURATION = 28;

function worldAt(t, trim) {
  const w = trimmed(baseWorld(), trim ? ["e2e", "docs", "triage"] : ["docs", "triage"]);
  let trans = null;
  const moveAt = (at, mutate, dur = 0.7) => {
    if (t < at) return;
    const before = JSON.parse(JSON.stringify(w));
    mutate(w);
    if (t < at + dur) trans = { from: before, p: (t - at) / dur };
  };
  // 01: payments refactor asks for permission
  moveAt(5.0, (w) => { w.rows.pay.state = "needs"; w.rows.pay.ago = 0; w.selected = "pay"; });
  // 02: background agents finish, the row lands in New
  if (t >= 8.2) { w.selected = "mono"; }
  if (t >= 8.6) w.rows.mono.progress = [Math.min(16, 9 + Math.floor((t - 8.6) / 0.3)), 16];
  moveAt(11.3, (w) => { delete w.rows.mono.progress; w.rows.mono.state = "unread"; w.rows.mono.ago = 0; w.selected = "mono"; });
  if (t >= 11.3 && t < 12.6) w.mood = "party";
  // 03: card pages
  const flips = [13.9, 15.1, 16.3];
  let page = 0, prevPage = 0, pageP = 1;
  flips.forEach((ft, i) => { if (t >= ft) { prevPage = i; page = i + 1; pageP = easeOut(span(t, ft, ft + 0.35)); } });
  if (t >= 12.6) { w.page = page; w.prevPage = prevPage; w.pageP = pageP; }
  if (t >= 14.4 && t < 17.6) { w.focusLeft = 1500 - Math.floor((t - 14.4) * 9); }
  // 04: download chip, then paste
  if (t >= 17.6) { w.page = 0; w.prevPage = 0; w.pageP = 1; w.focusLeft = null; }
  if (t >= 18.0 && t < 20.6) w.download = { name: "IMG_2041.png", ago: "now", in: easeOut(span(t, 18.0, 18.5)), press: t > 19.6 ? Math.sin(span(t, 19.6, 20.0) * Math.PI) : 0, out: t > 20.1 ? span(t, 20.1, 20.5) : null };
  if (t >= 17.6 && t < 21.4) w.selected = "copy";
  if (t >= 20.1 && t < 21.4) w.typed = "~/Downloads/IMG_2041.png ";
  // 05: ⌘ keys roll in
  if (t >= 21.8 && t < 24.4) w.keys = Math.floor((t - 21.8) / 0.12);
  if (t >= 24.4) w.mood = "idle";
  return { w, trans };
}

const params = new URLSearchParams(location.search);
const MODE = params.get("mode") ?? "video";
const FMT = params.get("fmt") ?? "16x9";
const stage = document.getElementById("stage");

function sizeStage(wd, ht) { stage.style.width = wd + "px"; stage.style.height = ht + "px"; document.body.style.width = wd + "px"; document.body.style.height = ht + "px"; }

function caption(html, style) { const d = document.createElement("div"); d.className = "cap"; Object.assign(d.style, style); d.innerHTML = html; stage.appendChild(d); return d; }

const WIN = { w: 760, h: 760 };

function renderVideo(t) {
  stage.innerHTML = "";
  const vertical = FMT === "9x16";
  const { w, trans } = worldAt(t, vertical);
  const scene = [...SCENES].reverse().find((s) => t >= s.at) ?? SCENES[0];
  const si = SCENES.indexOf(scene);
  const capIn = easeOut(span(t, scene.at + 0.05, scene.at + 0.55));
  const capOut = 1 - span(t, scene.end - 0.3, scene.end);
  const capA = si === SCENES.length - 1 ? capIn : capIn * capOut;

  // Window / sidebar placement with a gentle camera.
  const winIn = easeOut(span(t, 0.9, 1.9));
  let zoom = 1;
  const zs = SCENES.find((s) => s.zoom && t >= s.at - 0.2 && t < s.end + 0.4);
  if (zs) {
    const zp = easeInOut(span(t, zs.at - 0.2, zs.at + 0.5)) * (1 - easeInOut(span(t, zs.end - 0.2, zs.end + 0.4)));
    zoom = 1 + (vertical ? 0 : 0.4) * zp;
  }
  const outro = scene.outro ? easeInOut(span(t, scene.at, scene.at + 0.8)) : 0;

  if (!vertical) {
    sizeStage(1920, 1080);
    const S = 1.3, sbH = WIN.h;
    const winEl = document.createElement("div");
    winEl.className = "win";
    winEl.style.width = WIN.w + "px"; winEl.style.height = WIN.h + "px";
    winEl.appendChild(sidebar(w, t, sbH, trans));
    winEl.appendChild(terminal(w, t, scene));
    // Focus point inside the window for zooms: the card or the chip, both bottom-left.
    const focus = { x: 130, y: zs?.zoom === "chip" ? WIN.h - 175 : WIN.h - 90 };
    const baseX = 800 + outro * 110, baseY = (1080 - WIN.h * S) / 2 + (1 - winIn) * 60;
    const sc = S * zoom * (1 - outro * 0.12);
    // Keep the focus point where it was at zoom 1 → drift towards it.
    const tx = baseX + focus.x * S - focus.x * sc, ty = baseY + focus.y * S - focus.y * sc;
    winEl.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
    winEl.style.opacity = winIn * (1 - outro * 0.55);
    stage.appendChild(winEl);
    const capLeft = 120;
    if (scene.outro) {
      const o = octoCanvas("party", t * 1.6, 9);
      const box = caption("", { left: capLeft + "px", top: "250px", opacity: capA });
      box.appendChild(o);
      box.insertAdjacentHTML("beforeend", `<div class="h1" style="margin-top:34px">Free &amp; <span class="grad">open source</span></div>
        <div class="sub" style="margin-top:18px">github.com/<b style="color:#fff">sahneo/cmux-agent-status</b></div>
        <div style="margin-top:30px;display:flex;gap:10px"><span class="badge">cmux ≥ 0.65</span><span class="badge">Claude Code</span><span class="badge">GPL-3.0</span></div>`);
    } else if (si === 0) {
      const box = caption("", { left: capLeft + "px", top: "330px", opacity: capA, transform: `translateY(${(1 - capIn) * 20}px)` });
      box.appendChild(octoCanvas("needs", t * 1.6, 6));
      box.insertAdjacentHTML("beforeend", `<div class="h1" style="margin-top:28px">${scene.title}</div><div class="sub" style="margin-top:20px;max-width:560px">${scene.sub}</div>`);
    } else {
      caption(`<div class="eyebrow"><span class="mono" style="color:#fff">${scene.eyebrow}</span><span style="width:40px;height:1px;background:#ffffff40"></span>Feature</div>
        <div class="h2" style="margin-top:22px">${scene.title}</div><div class="sub" style="margin-top:18px;max-width:560px">${scene.sub}</div>`,
        { left: capLeft + "px", top: "380px", opacity: capA, transform: `translateY(${(1 - capIn) * 24}px)` });
    }
    progressBar(1920, t);
  } else {
    sizeStage(1080, 1920);
    const sbH = 690, S = 1.9 * (1 - outro * 0.2);
    const sb = sidebar(w, t, sbH, trans, { solo: true });
    const focus = { x: 126, y: zs?.zoom === "chip" ? sbH - 175 : sbH - 90 };
    const sc = S * zoom;
    const baseX = (1080 - 252 * S) / 2, baseY = 480 + (1 - winIn) * 80 + outro * 120;
    const tx = baseX + focus.x * S - focus.x * sc, ty = baseY + focus.y * S - focus.y * sc;
    sb.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
    sb.style.opacity = winIn * (1 - outro * 0.6);
    stage.appendChild(sb);
    const top = 150;
    if (scene.outro) {
      const box = caption("", { left: "80px", right: "80px", top: top + "px", opacity: capA, textAlign: "center" });
      const o = octoCanvas("party", t * 1.6, 8); o.style.margin = "0 auto";
      box.appendChild(o);
      box.insertAdjacentHTML("beforeend", `<div class="h1" style="margin-top:26px;font-size:76px">Free &amp; <span class="grad">open source</span></div><div class="sub" style="margin-top:16px;font-size:26px">github.com/sahneo/<br><b style="color:#fff">cmux-agent-status</b></div>`);
    } else {
      caption(`${scene.eyebrow ? `<div class="eyebrow" style="justify-content:center;font-size:20px"><span class="mono" style="color:#fff">${scene.eyebrow}</span></div>` : ""}
        <div class="h2" style="margin-top:18px;font-size:${si === 0 ? 84 : 70}px">${scene.title}</div><div class="sub" style="margin-top:20px;font-size:28px">${scene.sub}</div>`,
        { left: "70px", right: "70px", top: top + "px", opacity: capA, textAlign: "center", transform: `translateY(${(1 - capIn) * 24}px)` });
    }
    progressBar(1080, t);
  }
}

function progressBar(wd, t) {
  const el = document.createElement("div");
  el.style.cssText = `position:absolute;left:0;bottom:0;height:4px;width:${wd * t / DURATION}px;background:linear-gradient(90deg,#5B8CFF,#8B5CF6,#EC4899,#F59E0B)`;
  stage.appendChild(el);
}

    <div class="sub" style="margin-top:20px;text-align:center;font-size:28px">A sidebar for cmux · open source</div>`, { left: "60px", right: "60px", top: "86px" });
  const sb = sidebar(w, 0.2, 628, null, { solo: true });
  sb.style.transform = `translate(${(1080 - 252 * 1.5) / 2}px, 355px) scale(1.5)`;
  stage.appendChild(sb);
}

window.seek = (t) => {
  if (MODE === "video") renderVideo(t);
  else if (MODE === "octo") renderOcto(t);
};
window.DURATION = DURATION;
if (MODE === "video") renderVideo(Number(params.get("t") ?? 6));
else if (MODE === "hero") renderHero();
else if (MODE === "window") renderWindow();
else if (MODE === "cards") renderCards();
else if (MODE === "octo") renderOcto(0);
else if (MODE === "poster") renderPoster();
